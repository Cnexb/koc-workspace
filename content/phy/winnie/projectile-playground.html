<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projectile Playground</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", Inter, system-ui, sans-serif; color: #37352f; background: #fff; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: #787774; }
  canvas { width: 100%; height: auto; border: 1px solid #e9e9e7; border-radius: 6px; background: #f7f5ff; }
  .rows { display: grid; gap: 12px; margin: 18px 0; }
  .row { display: grid; grid-template-columns: 118px 1fr 74px; align-items: center; gap: 12px; }
  .row label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #7c3aed; }
  .val { font-variant-numeric: tabular-nums; text-align: right; color: #7c3aed; font-weight: 600; }
  .readout { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat { flex: 1 1 140px; border: 1px solid #e9e9e7; border-radius: 6px; padding: 10px 12px; background: #fbfbfa; }
  .stat b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9b9a97; }
  .stat span { font-size: 17px; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #dcdbd8; border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { background: #f1f1ef; }
  button.go { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .btns { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Projectile Playground</h1>
  <p class="lead">Set the launch angle and speed, then fire. Air resistance is ignored, g = 9.81 m/s².</p>

  <canvas id="stage" width="840" height="420"></canvas>

  <div class="rows">
    <div class="row"><label for="ang">Angle</label><input id="ang" type="range" min="5" max="85" step="1" value="45"><span class="val" id="angv"></span></div>
    <div class="row"><label for="spd">Speed</label><input id="spd" type="range" min="5" max="40" step="1" value="22"><span class="val" id="spdv"></span></div>
    <div class="row"><label for="hgt">Launch height</label><input id="hgt" type="range" min="0" max="20" step="1" value="0"><span class="val" id="hgtv"></span></div>
  </div>

  <div class="readout">
    <div class="stat"><b>Range</b><span id="range"></span></div>
    <div class="stat"><b>Max height</b><span id="apex"></span></div>
    <div class="stat"><b>Flight time</b><span id="time"></span></div>
    <div class="stat"><b>Best angle</b><span id="best"></span></div>
  </div>

  <p class="btns"><button class="go" id="fire">Fire</button><button id="clear">Clear trails</button></p>
</div>

<script>
(function () {
  var cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, G = 9.81, GROUND = H - 46, PAD = 46;
  var trails = [], anim = null;

  function val(id) { return +document.getElementById(id).value; }

  function solve() {
    var a = val('ang') * Math.PI / 180, v = val('spd'), h = val('hgt');
    var vy = v * Math.sin(a), vx = v * Math.cos(a);
    var t = (vy + Math.sqrt(vy * vy + 2 * G * h)) / G;
    return { vx: vx, vy: vy, h: h, t: t, range: vx * t, apex: h + vy * vy / (2 * G) };
  }

  function scale(s) {
    var maxX = Math.max(s.range, 10), maxY = Math.max(s.apex, 10);
    return Math.min((W - PAD * 2) / maxX, (GROUND - PAD) / maxY);
  }

  function frame(s, k, progress) {
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = '#efeafd';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#c9bcf3';
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

    ctx.strokeStyle = '#e3dcfa';
    ctx.lineWidth = 1;
    for (var m = 10; m * k < W - PAD; m += 10) {
      ctx.beginPath(); ctx.moveTo(PAD + m * k, 0); ctx.lineTo(PAD + m * k, GROUND); ctx.stroke();
      ctx.fillStyle = '#9b8fc4';
      ctx.font = '11px Segoe UI';
      ctx.fillText(m + ' m', PAD + m * k + 3, GROUND - 5);
    }

    trails.forEach(function (tr) {
      ctx.strokeStyle = 'rgba(124,58,237,.22)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      tr.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
      ctx.stroke();
    });

    var pts = [];
    var steps = 160, upto = Math.floor(steps * progress);
    for (var i = 0; i <= upto; i++) {
      var t = s.t * i / steps;
      var x = PAD + s.vx * t * k;
      var y = GROUND - (s.h + s.vy * t - 0.5 * G * t * t) * k;
      pts.push([x, y]);
    }
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
    ctx.stroke();

    if (pts.length) {
      var last = pts[pts.length - 1];
      ctx.fillStyle = '#d64545';
      ctx.beginPath(); ctx.arc(last[0], last[1], 6, 0, 7); ctx.fill();
    }

    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(PAD, GROUND); ctx.lineTo(PAD, GROUND - s.h * k); ctx.stroke();

    return pts;
  }

  function readout(s) {
    document.getElementById('angv').textContent = val('ang') + '°';
    document.getElementById('spdv').textContent = val('spd') + ' m/s';
    document.getElementById('hgtv').textContent = val('hgt') + ' m';
    document.getElementById('range').textContent = s.range.toFixed(1) + ' m';
    document.getElementById('apex').textContent = s.apex.toFixed(1) + ' m';
    document.getElementById('time').textContent = s.t.toFixed(2) + ' s';

    var best = 45, bestR = 0;
    for (var a = 5; a <= 85; a++) {
      var r = Math.pow(val('spd'), 2) * Math.sin(2 * a * Math.PI / 180) / G;
      var vy = val('spd') * Math.sin(a * Math.PI / 180);
      var t = (vy + Math.sqrt(vy * vy + 2 * G * val('hgt'))) / G;
      r = val('spd') * Math.cos(a * Math.PI / 180) * t;
      if (r > bestR) { bestR = r; best = a; }
    }
    document.getElementById('best').textContent = best + '° → ' + bestR.toFixed(1) + ' m';
  }

  function preview() {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    var s = solve();
    readout(s);
    frame(s, scale(s), 1);
  }

  function fire() {
    if (anim) cancelAnimationFrame(anim);
    var s = solve(), k = scale(s), start = null;
    readout(s);
    (function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / (s.t * 320));
      var pts = frame(s, k, p);
      if (p < 1) anim = requestAnimationFrame(step);
      else { anim = null; trails.push(pts); if (trails.length > 5) trails.shift(); }
    })(performance.now());
  }

  ['ang', 'spd', 'hgt'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', preview);
  });
  document.getElementById('fire').addEventListener('click', fire);
  document.getElementById('clear').addEventListener('click', function () { trails = []; preview(); });
  preview();
})();
</script>
</body>
</html>

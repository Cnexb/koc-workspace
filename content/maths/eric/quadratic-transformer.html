<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadratic Transformer</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", Inter, system-ui, sans-serif; color: #37352f; background: #fff; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: #787774; }
  canvas { width: 100%; height: auto; border: 1px solid #e9e9e7; border-radius: 6px; background: #fbfbfa; }
  .rows { display: grid; gap: 12px; margin: 18px 0; }
  .row { display: grid; grid-template-columns: 74px 1fr 64px; align-items: center; gap: 12px; }
  .row label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #3b6fd4; }
  .val { font-variant-numeric: tabular-nums; text-align: right; color: #3b6fd4; font-weight: 600; }
  .readout { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat { flex: 1 1 150px; border: 1px solid #e9e9e7; border-radius: 6px; padding: 10px 12px; background: #fbfbfa; }
  .stat b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9b9a97; }
  .stat span { font-size: 17px; font-variant-numeric: tabular-nums; }
  .eq { font-size: 19px; font-weight: 600; margin: 4px 0 16px; color: #3b6fd4; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #dcdbd8; border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { background: #f1f1ef; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quadratic Transformer</h1>
  <p class="lead">Move the sliders to see how each coefficient reshapes y = ax² + bx + c.</p>

  <div class="eq" id="eq"></div>
  <canvas id="plot" width="820" height="500"></canvas>

  <div class="rows">
    <div class="row"><label for="a">a</label><input id="a" type="range" min="-3" max="3" step="0.1" value="1"><span class="val" id="av"></span></div>
    <div class="row"><label for="b">b</label><input id="b" type="range" min="-8" max="8" step="0.1" value="0"><span class="val" id="bv"></span></div>
    <div class="row"><label for="c">c</label><input id="c" type="range" min="-8" max="8" step="0.1" value="-2"><span class="val" id="cv"></span></div>
  </div>

  <div class="readout">
    <div class="stat"><b>Vertex</b><span id="vertex"></span></div>
    <div class="stat"><b>Discriminant</b><span id="disc"></span></div>
    <div class="stat"><b>Roots</b><span id="roots"></span></div>
    <div class="stat"><b>Opens</b><span id="opens"></span></div>
  </div>

  <p><button id="reset">Reset</button></p>
</div>

<script>
(function () {
  var cv = document.getElementById('plot'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, SCALE = 40, OX = W / 2, OY = H / 2;
  var ids = ['a', 'b', 'c'];

  function px(x) { return OX + x * SCALE; }
  function py(y) { return OY - y * SCALE; }

  function grid() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e6e6e3';
    for (var x = -Math.floor(OX / SCALE); x <= OX / SCALE; x++) {
      ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), H); ctx.stroke();
    }
    for (var y = -Math.floor(OY / SCALE); y <= OY / SCALE; y++) {
      ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(W, py(y)); ctx.stroke();
    }
    ctx.strokeStyle = '#9b9a97';
    ctx.beginPath(); ctx.moveTo(0, OY); ctx.lineTo(W, OY);
    ctx.moveTo(OX, 0); ctx.lineTo(OX, H); ctx.stroke();
  }

  function draw() {
    var a = +document.getElementById('a').value,
        b = +document.getElementById('b').value,
        c = +document.getElementById('c').value;

    ids.forEach(function (id) {
      document.getElementById(id + 'v').textContent = (+document.getElementById(id).value).toFixed(1);
    });

    grid();

    ctx.strokeStyle = '#3b6fd4';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    var first = true;
    for (var sx = 0; sx <= W; sx += 2) {
      var x = (sx - OX) / SCALE, y = a * x * x + b * x + c;
      if (first) { ctx.moveTo(sx, py(y)); first = false; } else ctx.lineTo(sx, py(y));
    }
    ctx.stroke();

    var vx = a ? -b / (2 * a) : 0, vy = a * vx * vx + b * vx + c;
    var d = b * b - 4 * a * c;

    if (a) {
      ctx.fillStyle = '#d64545';
      ctx.beginPath(); ctx.arc(px(vx), py(vy), 5, 0, 7); ctx.fill();
      ctx.setLineDash([4, 4]); ctx.strokeStyle = '#d6454566'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px(vx), 0); ctx.lineTo(px(vx), H); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (a && d >= 0) {
      var r1 = (-b + Math.sqrt(d)) / (2 * a), r2 = (-b - Math.sqrt(d)) / (2 * a);
      ctx.fillStyle = '#1f9d55';
      [r1, r2].forEach(function (r) { ctx.beginPath(); ctx.arc(px(r), py(0), 4.5, 0, 7); ctx.fill(); });
      document.getElementById('roots').textContent = d === 0 ? r1.toFixed(2) + ' (repeated)'
        : Math.min(r1, r2).toFixed(2) + ' and ' + Math.max(r1, r2).toFixed(2);
    } else {
      document.getElementById('roots').textContent = a ? 'none (complex)' : 'linear';
    }

    var sgn = function (n, unit) { return (n < 0 ? ' − ' : ' + ') + Math.abs(n).toFixed(1) + unit; };
    document.getElementById('eq').textContent = 'y = ' + a.toFixed(1) + 'x²' + sgn(b, 'x') + sgn(c, '');
    document.getElementById('vertex').textContent = a ? '(' + vx.toFixed(2) + ', ' + vy.toFixed(2) + ')' : '—';
    document.getElementById('disc').textContent = d.toFixed(2);
    document.getElementById('opens').textContent = a > 0 ? 'upwards ∪' : a < 0 ? 'downwards ∩' : 'straight line';
  }

  ids.forEach(function (id) { document.getElementById(id).addEventListener('input', draw); });
  document.getElementById('reset').addEventListener('click', function () {
    document.getElementById('a').value = 1;
    document.getElementById('b').value = 0;
    document.getElementById('c').value = -2;
    draw();
  });
  draw();
})();
</script>
</body>
</html>

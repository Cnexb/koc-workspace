<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titration Curve Lab</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", Inter, system-ui, sans-serif; color: #37352f; background: #fff; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; color: #787774; }
  .split { display: flex; gap: 20px; flex-wrap: wrap; }
  canvas { flex: 1 1 420px; min-width: 300px; border: 1px solid #e9e9e7; border-radius: 6px; background: #fbfbfa; }
  .flask { flex: 0 0 150px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .beaker {
    width: 116px; height: 150px; border: 3px solid #b9b7b2; border-top: 0;
    border-radius: 0 0 22px 22px; display: flex; align-items: flex-end; overflow: hidden; background: #fff;
  }
  .liquid { width: 100%; height: 62%; transition: background .3s; border-top: 2px solid rgba(0, 0, 0, .14); }
  .ph-badge { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rows { margin: 18px 0; }
  .row { display: grid; grid-template-columns: 132px 1fr 78px; align-items: center; gap: 12px; }
  .row label { font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #d97706; }
  .val { font-variant-numeric: tabular-nums; text-align: right; color: #d97706; font-weight: 600; }
  .readout { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .stat { flex: 1 1 150px; border: 1px solid #e9e9e7; border-radius: 6px; padding: 10px 12px; background: #fbfbfa; }
  .stat b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9b9a97; }
  .stat span { font-size: 17px; font-variant-numeric: tabular-nums; }
  select { padding: 5px 8px; border: 1px solid #dcdbd8; border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Titration Curve Lab</h1>
  <p class="lead">Adding 0.100 M NaOH to 25.0 cm³ of acid. Drag the burette slider and watch the pH curve and indicator colour.</p>

  <div class="split">
    <canvas id="curve" width="560" height="380"></canvas>
    <div class="flask">
      <div class="beaker"><div class="liquid" id="liquid"></div></div>
      <div class="ph-badge" id="phBadge"></div>
      <div style="font-size:12.5px;color:#787774" id="indName"></div>
      <select id="ind">
        <option value="phen">Phenolphthalein</option>
        <option value="methyl">Methyl orange</option>
        <option value="uni">Universal indicator</option>
      </select>
    </div>
  </div>

  <div class="rows">
    <div class="row">
      <label for="vol">NaOH added</label>
      <input id="vol" type="range" min="0" max="50" step="0.1" value="0">
      <span class="val" id="volv"></span>
    </div>
    <div class="row">
      <label for="acid">Acid</label>
      <input id="acid" type="range" min="0" max="1" step="1" value="0">
      <span class="val" id="acidv"></span>
    </div>
  </div>

  <div class="readout">
    <div class="stat"><b>pH now</b><span id="phNow"></span></div>
    <div class="stat"><b>Equivalence point</b><span id="eq"></span></div>
    <div class="stat"><b>Moles NaOH added</b><span id="mol"></span></div>
    <div class="stat"><b>Stage</b><span id="stage"></span></div>
  </div>
</div>

<script>
(function () {
  var cv = document.getElementById('curve'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height, L = 46, B = 34, T = 14, R = 14;
  var Ca = 0.100, Va = 25.0, Cb = 0.100, Ka = 1.8e-5, Kw = 1e-14;
  var EQ = Ca * Va / Cb;

  function isStrong() { return +document.getElementById('acid').value === 0; }

  function pH(Vb) {
    var na = Ca * Va / 1000, nb = Cb * Vb / 1000, Vt = (Va + Vb) / 1000;
    if (isStrong()) {
      if (nb < na) return -Math.log10((na - nb) / Vt);
      if (Math.abs(nb - na) < 1e-9) return 7;
      return 14 + Math.log10((nb - na) / Vt);
    }
    if (nb <= 1e-9) return -Math.log10((-Ka + Math.sqrt(Ka * Ka + 4 * Ka * (na / Vt))) / 2);
    if (nb < na) return -Math.log10(Ka) + Math.log10(nb / (na - nb));           // buffer region
    if (Math.abs(nb - na) < 1e-9) {
      var A = na / Vt;
      return 14 + Math.log10(Math.sqrt(Kw / Ka * A));                          // hydrolysis of salt
    }
    return 14 + Math.log10((nb - na) / Vt);
  }

  function colour(p) {
    var kind = document.getElementById('ind').value;
    if (kind === 'phen') return p < 8.2 ? '#f2f0ff' : p < 10 ? '#f6a8d8' : '#e0459e';
    if (kind === 'methyl') return p < 3.1 ? '#e04a1f' : p < 4.4 ? '#e8853a' : '#f2d24b';
    var stops = [[1, '#d6202a'], [3, '#e2601f'], [5, '#e8c327'], [7, '#4aa84a'], [9, '#2f7fc4'], [11, '#3b3fa8'], [13, '#5a2f8f']];
    for (var i = 0; i < stops.length; i++) if (p <= stops[i][0]) return stops[i][1];
    return '#6b2fa8';
  }

  function label(p) {
    var kind = document.getElementById('ind').value;
    if (kind === 'phen') return p < 8.2 ? 'colourless' : 'pink';
    if (kind === 'methyl') return p < 3.1 ? 'red' : p < 4.4 ? 'orange' : 'yellow';
    return p < 6.5 ? 'acidic hue' : p < 7.5 ? 'green' : 'alkaline hue';
  }

  function x(v) { return L + v / 50 * (W - L - R); }
  function y(p) { return H - B - (p / 14) * (H - B - T); }

  function draw() {
    var Vb = +document.getElementById('vol').value;
    var p = pH(Vb);

    ctx.clearRect(0, 0, W, H);
    ctx.font = '11px Segoe UI';

    ctx.strokeStyle = '#ececea';
    ctx.lineWidth = 1;
    for (var g = 0; g <= 14; g += 2) {
      ctx.beginPath(); ctx.moveTo(L, y(g)); ctx.lineTo(W - R, y(g)); ctx.stroke();
      ctx.fillStyle = '#9b9a97';
      ctx.fillText(g, 22, y(g) + 4);
    }
    for (var v = 0; v <= 50; v += 10) {
      ctx.beginPath(); ctx.moveTo(x(v), T); ctx.lineTo(x(v), H - B); ctx.stroke();
      ctx.fillStyle = '#9b9a97';
      ctx.fillText(v, x(v) - 5, H - B + 16);
    }
    ctx.fillStyle = '#787774';
    ctx.fillText('pH', 20, T + 2);
    ctx.fillText('NaOH added / cm³', W - 130, H - 8);

    ctx.strokeStyle = '#c9c8c5';
    ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, H - B); ctx.lineTo(W - R, H - B); ctx.stroke();

    ctx.setLineDash([5, 4]);
    ctx.strokeStyle = '#b9b7b2';
    ctx.beginPath(); ctx.moveTo(x(EQ), T); ctx.lineTo(x(EQ), H - B); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#787774';
    ctx.fillText('equivalence', x(EQ) + 5, T + 12);

    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var i = 0; i <= 600; i++) {
      var vv = i / 600 * 50, pp = Math.max(0, Math.min(14, pH(vv)));
      i ? ctx.lineTo(x(vv), y(pp)) : ctx.moveTo(x(vv), y(pp));
    }
    ctx.stroke();

    ctx.fillStyle = '#37352f';
    ctx.beginPath(); ctx.arc(x(Vb), y(Math.max(0, Math.min(14, p))), 5.5, 0, 7); ctx.fill();

    document.getElementById('volv').textContent = Vb.toFixed(1) + ' cm³';
    document.getElementById('acidv').textContent = isStrong() ? 'HCl' : 'CH₃COOH';
    document.getElementById('phNow').textContent = p.toFixed(2);
    document.getElementById('eq').textContent = EQ.toFixed(1) + ' cm³ · pH ' + pH(EQ).toFixed(2);
    document.getElementById('mol').textContent = (Cb * Vb / 1000 * 1000).toFixed(2) + ' mmol';
    document.getElementById('stage').textContent =
      Vb < EQ - 0.05 ? (isStrong() ? 'excess acid' : 'buffer region')
      : Vb > EQ + 0.05 ? 'excess base' : 'equivalence';

    document.getElementById('liquid').style.background = colour(p);
    document.getElementById('phBadge').textContent = 'pH ' + p.toFixed(1);
    document.getElementById('indName').textContent = label(p);
  }

  ['vol', 'acid', 'ind'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', draw);
    document.getElementById(id).addEventListener('change', draw);
  });
  draw();
})();
</script>
</body>
</html>
